<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/style.css"><title>Log in - TaskFlow</title></head>
<body data-page="login"><div class="auth-page"><div class="auth-card">
<a class="brand" href="/"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>TaskFlow</a>
<h1>Welcome back</h1><p class="lead">Log in to manage your tasks.</p>
<div class="alert danger" id="form-alert" hidden></div>
<form id="auth-form" novalidate>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email"><p class="err" data-err="email"></p></div>
<div class="field"><label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" autocomplete="current-password"><button type="button" class="pw-toggle" data-toggle="password" aria-label="Show password">Show</button></div><p class="err" data-err="password"></p></div>
<button class="btn primary" type="submit">Log in</button></form>
<p class="alt">New to TaskFlow? <a href="/register.html">Create an account</a></p></div></div>
<script src="/js/api.js"></script><script src="/js/auth.js"></script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/css/style.css"><title>All Tasks - TaskFlow</title></head>
<body data-protected="1"><div class="app"><aside class="sidebar" id="sidebar"></aside><div class="main"><header class="topbar" id="topbar"></header><main id="content">
<div class="page-head"><div><h1>All Tasks</h1><p>Search, filter and manage every task.</p></div><button type="button" class="btn primary" id="add-task"></button></div>
<div class="filters card">
<div class="search"><span id="search-icon"></span><input id="f-q" type="search" placeholder="Search title or description" aria-label="Search tasks"></div>
<select id="f-status" aria-label="Filter by status"><option value="">All statuses</option><option value="pending">Pending</option><option value="in_progress">In Progress</option><option value="completed">Completed</option></select>
<select id="f-priority" aria-label="Filter by priority"><option value="">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
<input id="f-due" type="date" aria-label="Filter by due date">
<select id="f-sort" aria-label="Sort tasks"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="deadline">By deadline</option><option value="priority">By priority</option></select>
<label class="check-inline"><input type="checkbox" id="f-overdue"> Overdue only</label>
<button type="button" class="btn ghost sm" id="f-clear">Clear</button></div>
<div id="list"></div><div class="pager" id="pager" hidden></div>
</main></div></div>
<script src="/js/api.js"></script><script src="/js/taskui.js"></script><script src="/js/tasks.js"></script></body></html>
